<section class="atelier-hero" id="home" aria-labelledby="hero-title" data-header-tone="dark">
  {{HERO_GARDEN}}
  <div class="hero-content">
    <p class="hero-eyebrow" data-i18n="atelier.hero.eyebrow">{{t:atelier.hero.eyebrow}}</p>
    <h1 data-i18n="atelier.hero.title" id="hero-title">{{t:atelier.hero.title}}</h1>
    <p data-i18n="atelier.hero.subtitle" class="hero-subtitle">{{t:atelier.hero.subtitle}}</p>
    <div class="hero-actions">
      <a class="hero-primary" href="#contact"><span data-i18n="atelier.hero.cta">{{t:atelier.hero.cta}}</span><span class="ui-arrow ui-arrow--ne" aria-hidden="true"></span></a>
      <a class="hero-explore" href="#lab-001"><span data-i18n="atelier.hero.explore">{{t:atelier.hero.explore}}</span><span class="ui-arrow ui-arrow--down" aria-hidden="true"></span></a>
    </div>
    <p class="hero-reassurance" data-i18n="atelier.hero.reassurance">{{t:atelier.hero.reassurance}}</p>
  </div>
  <button class="hero-motion-toggle" type="button" aria-controls="hero-garden" hidden><span class="garden-motion-icon" aria-hidden="true"></span><span data-i18n="atelier.garden.pause">{{t:atelier.garden.pause}}</span></button>
</section>
